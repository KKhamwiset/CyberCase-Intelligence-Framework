# Alembic configuration for TSR_Mitre backend

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic
path_separator = os
version_locations = %(here)s/alembic/baseline_versions

# Template for new migration files
# file_template = %%(rev)s_%%(slug)s

# The URL is overridden in env.py from app.config.settings
# This is a fallback only — never put real credentials here.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/tsr_mitre

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
