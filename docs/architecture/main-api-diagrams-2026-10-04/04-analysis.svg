<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2673" viewBox="0 0 1560 2673" role="img"><title>4. วิเคราะห์เคส</title><rect width="1560" height="2673" fill="white" /><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b" /></marker></defs><text x="38" y="48" fill="#0f172a" font-family="Tahoma" font-size="29" text-anchor="start" font-weight="700"><tspan x="38" dy="0">4. วิเคราะห์เคส</tspan></text><text x="38" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Frontend → HTTP API → Backend → ข้อมูล → ผลลัพธ์กลับสู่หน้าจอ</tspan></text><text x="1522" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="end" font-weight="400"><tspan x="1522" dy="0">เส้นทึบ = คำขอ / งานภายใน    เส้นประ = ผลลัพธ์</tspan></text><rect x="55" y="1154" width="1450" height="241" rx="7" fill="none" stroke="#94a3b8" stroke-width="1.5" /><rect x="40" y="736" width="1480" height="1588" rx="7" fill="none" stroke="#94a3b8" stroke-width="1.5" /><line x1="200.0" y1="202" x2="200.0" y2="2613" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="45.0" y="112" width="310" height="86" rx="10" fill="#eff6ff" stroke="#94a3b8" /><text x="200.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0">Frontend Analyze / Analysis</tspan></text><line x1="586.6666666666667" y1="202" x2="586.6666666666667" y2="2613" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="431.66666666666674" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="586.6666666666667" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="586.6666666666667" dy="0">FastAPI run_case_analysis</tspan></text><line x1="973.3333333333334" y1="202" x2="973.3333333333334" y2="2613" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="818.3333333333334" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="973.3333333333334" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="973.3333333333334" dy="0">LLM / RAG service</tspan></text><line x1="1360.0" y1="202" x2="1360.0" y2="2613" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="1205.0" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="1360.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="1360.0" dy="0">PostgreSQL</tspan></text><rect x="64" y="224" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="252" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">ทุก endpoint มี prefix /api/v1</tspan></text><line x1="200.0" y1="365" x2="586.6666666666667" y2="365" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="301" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="320" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">1. POST /cases/{case_id}/analysis</tspan><tspan x="393.33333333333337" dy="23">— startCaseAnalysis()</tspan></text><line x1="586.6666666666667" y1="457" x2="1360.0" y2="457" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="393" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="412" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">2. อ่าน sources + follow-up QA +</tspan><tspan x="973.3333333333334" dy="23">revision</tspan></text><line x1="1360.0" y1="549" x2="586.6666666666667" y2="549" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="798.3333333333334" y="485" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="504" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">3. AnalysisInput — ปิด transaction</tspan><tspan x="973.3333333333334" dy="23">ก่อนงานช้า</tspan></text><line x1="586.6666666666667" y1="641" x2="973.3333333333334" y2="641" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="577" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="596" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">4. assess_gaps —</tspan><tspan x="780.0" dy="23">ประเมินข้อมูลที่ขาด</tspan></text><line x1="973.3333333333334" y1="710" x2="586.6666666666667" y2="710" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="669" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="688" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">5. CaseAssessmentTrace</tspan></text><rect x="64" y="740" width="1432" height="42" rx="6" fill="#fff7ed" /><text x="780.0" y="768" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0">ALT · มีช่องว่างที่ควรถามและยังไม่เกินงบคำถาม</tspan></text><line x1="586.6666666666667" y1="864" x2="1360.0" y2="864" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="800" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="819" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">6. เก็บ assessment +</tspan><tspan x="973.3333333333334" dy="23">followup_question</tspan></text><line x1="586.6666666666667" y1="956" x2="200.0" y2="956" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="892" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="911" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">7. SSE result — AnalysisStepRead(s</tspan><tspan x="393.33333333333337" dy="23">tatus=need_followup)</tspan></text><path d="M 200.0 1048 H 335.0 V 1075 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="984" width="350" height="51" rx="3" fill="white" /><text x="330.0" y="1003" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">8. useAnalysisRunOutcome →</tspan><tspan x="330.0" dy="23">เปิดแชต</tspan></text><rect x="64" y="1096" width="1432" height="42" rx="6" fill="#fff7ed" /><text x="780.0" y="1124" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0">ELSE · พร้อมวิเคราะห์ต่อ</tspan></text><rect x="64" y="1158" width="1432" height="42" rx="6" fill="#fff7ed" /><text x="780.0" y="1186" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0">OPT · MITRE gate ผ่านและต้องดึงบริบทใหม่</tspan></text><line x1="586.6666666666667" y1="1282" x2="973.3333333333334" y2="1282" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="1218" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1237" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">9. POST rag-service:8001/query —</tspan><tspan x="780.0" dy="23">backend เรียกเท่านั้น</tspan></text><line x1="973.3333333333334" y1="1351" x2="586.6666666666667" y2="1351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="1310" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="1329" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">10. บริบทเทคนิค + MITRE</tspan></text><line x1="586.6666666666667" y1="1467" x2="973.3333333333334" y2="1467" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="1403" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1422" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">11. case_reading — sources +</tspan><tspan x="780.0" dy="23">follow-up QA</tspan></text><line x1="973.3333333333334" y1="1559" x2="586.6666666666667" y2="1559" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="1495" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1514" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">12. Reading — claims / parties /</tspan><tspan x="780.0" dy="23">timeline / impacts</tspan></text><path d="M 586.6666666666667 1651 H 721.6666666666667 V 1678 H 586.6666666666667" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="541.6666666666667" y="1587" width="350" height="51" rx="3" fill="white" /><text x="716.6666666666667" y="1606" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="716.6666666666667" dy="0">13. bound_claims — ตรวจ quote</tspan><tspan x="716.6666666666667" dy="23">กับแหล่งข้อมูล</tspan></text><line x1="586.6666666666667" y1="1761" x2="973.3333333333334" y2="1761" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="1697" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1716" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">14. case_judgement — checked</tspan><tspan x="780.0" dy="23">reading + QA + technical context</tspan></text><line x1="973.3333333333334" y1="1853" x2="586.6666666666667" y2="1853" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="1789" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1808" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">15. Summary / gaps / MITRE</tspan><tspan x="780.0" dy="23">associations</tspan></text><path d="M 586.6666666666667 1945 H 721.6666666666667 V 1972 H 586.6666666666667" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="541.6666666666667" y="1881" width="350" height="51" rx="3" fill="white" /><text x="716.6666666666667" y="1900" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="716.6666666666667" dy="0">16. bound_references — ตรวจ</tspan><tspan x="716.6666666666667" dy="23">claim และ technique IDs</tspan></text><line x1="586.6666666666667" y1="2055" x2="1360.0" y2="2055" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="1991" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="2010" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">17. ตรวจ revision แล้วเก็บ</tspan><tspan x="973.3333333333334" dy="23">validated result + snapshots</tspan></text><line x1="586.6666666666667" y1="2170" x2="200.0" y2="2170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="2083" width="350" height="74" rx="3" fill="white" /><text x="393.33333333333337" y="2102" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">18. SSE result —</tspan><tspan x="393.33333333333337" dy="23">AnalysisStepRead(status=completed,</tspan><tspan x="393.33333333333337" dy="23">result)</tspan></text><path d="M 200.0 2262 H 335.0 V 2289 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="2198" width="350" height="51" rx="3" fill="white" /><text x="330.0" y="2217" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">19. Query cache + เปิดหน้า</tspan><tspan x="330.0" dy="23">Analysis</tspan></text><rect x="64" y="2334" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="2362" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">ระหว่างทำงานมี SSE step; ผิดพลาดส่ง SSE error</tspan></text><line x1="200.0" y1="2475" x2="586.6666666666667" y2="2475" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="2411" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="2430" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">20. GET /cases/{case_id}/analysis</tspan><tspan x="393.33333333333337" dy="23">— getCaseAnalysis()</tspan></text><line x1="586.6666666666667" y1="2567" x2="200.0" y2="2567" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="2503" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="2522" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">21. CaseAnalysisResultRead หรือ</tspan><tspan x="393.33333333333337" dy="23">null — freshness current/stale</tspan></text><text x="38" y="2648" fill="#64748b" font-family="Tahoma" font-size="14" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Code 5fdfb4d6 · ตรวจเส้นทาง 2026-10-04</tspan></text></svg>