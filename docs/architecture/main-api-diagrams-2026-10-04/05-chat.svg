<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1667" viewBox="0 0 1560 1667" role="img"><title>5. แชตทั่วไปกับเคส</title><rect width="1560" height="1667" fill="white" /><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b" /></marker></defs><text x="38" y="48" fill="#0f172a" font-family="Tahoma" font-size="29" text-anchor="start" font-weight="700"><tspan x="38" dy="0">5. แชตทั่วไปกับเคส</tspan></text><text x="38" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Frontend → HTTP API → Backend → ข้อมูล → ผลลัพธ์กลับสู่หน้าจอ</tspan></text><text x="1522" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="end" font-weight="400"><tspan x="1522" dy="0">เส้นทึบ = คำขอ / งานภายใน    เส้นประ = ผลลัพธ์</tspan></text><line x1="200.0" y1="202" x2="200.0" y2="1607" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="45.0" y="112" width="310" height="86" rx="10" fill="#eff6ff" stroke="#94a3b8" /><text x="200.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0">Frontend WorkspaceChatPanel</tspan></text><line x1="586.6666666666667" y1="202" x2="586.6666666666667" y2="1607" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="431.66666666666674" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="586.6666666666667" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="586.6666666666667" dy="0">FastAPI send_case_message</tspan></text><line x1="973.3333333333334" y1="202" x2="973.3333333333334" y2="1607" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="818.3333333333334" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="973.3333333333334" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="973.3333333333334" dy="0">LLM</tspan></text><line x1="1360.0" y1="202" x2="1360.0" y2="1607" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="1205.0" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="1360.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="1360.0" dy="0">PostgreSQL</tspan></text><rect x="64" y="224" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="252" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">ทุก endpoint มี prefix /api/v1; รูปนี้ไม่มี pending follow-up</tspan></text><line x1="200.0" y1="365" x2="586.6666666666667" y2="365" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="301" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="320" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">1. GET /cases/{case_id}/chat —</tspan><tspan x="393.33333333333337" dy="23">getCaseChat()</tspan></text><line x1="586.6666666666667" y1="434" x2="1360.0" y2="434" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="393" width="350" height="28" rx="3" fill="white" /><text x="973.3333333333334" y="412" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">2. อ่านข้อความ + pending question</tspan></text><line x1="586.6666666666667" y1="503" x2="200.0" y2="503" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="462" width="350" height="28" rx="3" fill="white" /><text x="393.33333333333337" y="481" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">3. CaseChatRead → ChatTranscript</tspan></text><line x1="200.0" y1="618" x2="586.6666666666667" y2="618" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="531" width="350" height="74" rx="3" fill="white" /><text x="393.33333333333337" y="550" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">4. POST</tspan><tspan x="393.33333333333337" dy="23">/cases/{case_id}/chat/messages —</tspan><tspan x="393.33333333333337" dy="23">content + client_request_id</tspan></text><line x1="586.6666666666667" y1="687" x2="1360.0" y2="687" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="646" width="350" height="28" rx="3" fill="white" /><text x="973.3333333333334" y="665" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">5. ตรวจ replay และไม่มีคำถามค้าง</tspan></text><line x1="586.6666666666667" y1="779" x2="1360.0" y2="779" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="715" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="734" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">6. เก็บข้อความผู้ใช้ —</tspan><tspan x="973.3333333333334" dy="23">record_question</tspan></text><line x1="586.6666666666667" y1="871" x2="1360.0" y2="871" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="807" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="826" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">7. อ่าน sources + QA + latest</tspan><tspan x="973.3333333333334" dy="23">analysis ถ้ามี</tspan></text><line x1="586.6666666666667" y1="963" x2="973.3333333333334" y2="963" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="899" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="918" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">8. answer_case_question —</tspan><tspan x="780.0" dy="23">ตอบจากบริบทเคส</tspan></text><line x1="973.3333333333334" y1="1055" x2="586.6666666666667" y2="1055" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="991" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1010" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">9. คำตอบพร้อมหน่วยข้อความและ</tspan><tspan x="780.0" dy="23">references</tspan></text><path d="M 586.6666666666667 1147 H 721.6666666666667 V 1174 H 586.6666666666667" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="541.6666666666667" y="1083" width="350" height="51" rx="3" fill="white" /><text x="716.6666666666667" y="1102" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="716.6666666666667" dy="0">10. ตรวจ claim IDs และ quote</tspan><tspan x="716.6666666666667" dy="23">ที่อ้าง</tspan></text><line x1="586.6666666666667" y1="1257" x2="1360.0" y2="1257" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="1193" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="1212" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">11. เก็บคำตอบ ChatMessage</tspan><tspan x="973.3333333333334" dy="23">ผูกกับข้อความผู้ใช้</tspan></text><line x1="586.6666666666667" y1="1372" x2="200.0" y2="1372" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="1285" width="350" height="74" rx="3" fill="white" /><text x="393.33333333333337" y="1304" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">12. SSE result —</tspan><tspan x="393.33333333333337" dy="23">CaseChatResponse(messages,</tspan><tspan x="393.33333333333337" dy="23">analysis=null)</tspan></text><path d="M 200.0 1464 H 335.0 V 1491 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="1400" width="350" height="51" rx="3" fill="white" /><text x="330.0" y="1419" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">13. useCaseChat → รวมข้อความใน</tspan><tspan x="330.0" dy="23">Query cache</tspan></text><rect x="64" y="1512" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="1540" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">เส้นนี้ตอบแชตโดยไม่เริ่มการวิเคราะห์เคสรอบใหม่</tspan></text><text x="38" y="1642" fill="#64748b" font-family="Tahoma" font-size="14" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Code 5fdfb4d6 · ตรวจเส้นทาง 2026-10-04</tspan></text></svg>