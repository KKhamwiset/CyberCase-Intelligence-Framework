<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1968" viewBox="0 0 1560 1968" role="img"><title>6. ตอบคำถามเพิ่มเติมและวิเคราะห์ต่อ</title><rect width="1560" height="1968" fill="white" /><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b" /></marker></defs><text x="38" y="48" fill="#0f172a" font-family="Tahoma" font-size="29" text-anchor="start" font-weight="700"><tspan x="38" dy="0">6. ตอบคำถามเพิ่มเติมและวิเคราะห์ต่อ</tspan></text><text x="38" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Frontend → HTTP API → Backend → ข้อมูล → ผลลัพธ์กลับสู่หน้าจอ</tspan></text><text x="1522" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="end" font-weight="400"><tspan x="1522" dy="0">เส้นทึบ = คำขอ / งานภายใน    เส้นประ = ผลลัพธ์</tspan></text><rect x="40" y="654" width="1480" height="1070" rx="7" fill="none" stroke="#94a3b8" stroke-width="1.5" /><line x1="200.0" y1="202" x2="200.0" y2="1908" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="45.0" y="112" width="310" height="86" rx="10" fill="#eff6ff" stroke="#94a3b8" /><text x="200.0" y="146" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0">Frontend Chat / Analysis</tspan><tspan x="200.0" dy="23">cache</tspan></text><line x1="586.6666666666667" y1="202" x2="586.6666666666667" y2="1908" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="431.66666666666674" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="586.6666666666667" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="586.6666666666667" dy="0">FastAPI send_case_message</tspan></text><line x1="973.3333333333334" y1="202" x2="973.3333333333334" y2="1908" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="818.3333333333334" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="973.3333333333334" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="973.3333333333334" dy="0">run_case_analysis</tspan></text><line x1="1360.0" y1="202" x2="1360.0" y2="1908" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="1205.0" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="1360.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="1360.0" dy="0">PostgreSQL</tspan></text><rect x="64" y="224" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="252" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">ใช้ POST /api/v1/cases/{case_id}/chat/messages เหมือนแชต</tspan></text><rect x="64" y="303" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="331" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">เริ่มเส้นนี้เมื่อ pending_question_id มีค่า</tspan></text><line x1="200.0" y1="444" x2="586.6666666666667" y2="444" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="380" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="399" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">1. createCaseChatMessage(content,</tspan><tspan x="393.33333333333337" dy="23">client_request_id)</tspan></text><line x1="586.6666666666667" y1="536" x2="1360.0" y2="536" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="472" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="491" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">2. ตรวจ replay / lock Case / อ่าน</tspan><tspan x="973.3333333333334" dy="23">pending question</tspan></text><line x1="586.6666666666667" y1="628" x2="1360.0" y2="628" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="564" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="583" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">3. เก็บ followup_answer</tspan><tspan x="973.3333333333334" dy="23">ที่ผูกกับคำถาม</tspan></text><rect x="64" y="658" width="1432" height="42" rx="6" fill="#fff7ed" /><text x="780.0" y="686" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0">ALT · ยังมีคำถามในรอบนี้</tspan></text><line x1="586.6666666666667" y1="759" x2="1360.0" y2="759" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="718" width="350" height="28" rx="3" fill="white" /><text x="973.3333333333334" y="737" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">4. เก็บ followup_question ถัดไป</tspan></text><line x1="586.6666666666667" y1="874" x2="200.0" y2="874" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="787" width="350" height="74" rx="3" fill="white" /><text x="393.33333333333337" y="806" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">5. CaseChatResponse(messages,</tspan><tspan x="393.33333333333337" dy="23">pending_question_id,</tspan><tspan x="393.33333333333337" dy="23">analysis=null)</tspan></text><path d="M 200.0 943 H 335.0 V 970 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="902" width="350" height="28" rx="3" fill="white" /><text x="330.0" y="921" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">6. แสดงคำถามต่อใน ChatTranscript</tspan></text><rect x="64" y="991" width="1432" height="42" rx="6" fill="#fff7ed" /><text x="780.0" y="1019" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0">ELSE · ตอบครบคำถามในรอบ</tspan></text><line x1="586.6666666666667" y1="1115" x2="973.3333333333334" y2="1115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="1051" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="1070" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">7. run_case_analysis(continuing_fo</tspan><tspan x="780.0" dy="23">llowup=True)</tspan></text><line x1="973.3333333333334" y1="1207" x2="1360.0" y2="1207" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="991.6666666666667" y="1143" width="350" height="51" rx="3" fill="white" /><text x="1166.6666666666667" y="1162" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="1166.6666666666667" dy="0">8. อ่าน sources + คำตอบ QA +</tspan><tspan x="1166.6666666666667" dy="23">ประวัติคำถาม</tspan></text><path d="M 973.3333333333334 1299 H 1108.3333333333335 V 1326 H 973.3333333333334" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="928.3333333333335" y="1235" width="350" height="51" rx="3" fill="white" /><text x="1103.3333333333335" y="1254" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="1103.3333333333335" dy="0">9. Assess → Ask หรือ Proceed ตาม</tspan><tspan x="1103.3333333333335" dy="23">policy</tspan></text><line x1="973.3333333333334" y1="1409" x2="1360.0" y2="1409" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="991.6666666666667" y="1345" width="350" height="51" rx="3" fill="white" /><text x="1166.6666666666667" y="1364" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="1166.6666666666667" dy="0">10. เก็บคำถามรอบใหม่ หรือผล</tspan><tspan x="1166.6666666666667" dy="23">validated</tspan></text><line x1="973.3333333333334" y1="1478" x2="586.6666666666667" y2="1478" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="1437" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="1456" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">11. AnalysisStep</tspan></text><line x1="586.6666666666667" y1="1570" x2="200.0" y2="1570" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="1506" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="1525" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">12. CaseChatResponse(messages,</tspan><tspan x="393.33333333333337" dy="23">pending_question_id, analysis?)</tspan></text><path d="M 200.0 1662 H 335.0 V 1689 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="1598" width="350" height="51" rx="3" fill="white" /><text x="330.0" y="1617" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">13. useCaseChat อัปเดต chat และ</tspan><tspan x="330.0" dy="23">analysis cache ถ้ามีผล</tspan></text><rect x="64" y="1734" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="1762" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">คำตอบเก็บเป็น ChatMessage / QA-*; ไม่เพิ่ม CaseSource หรือ source_revision</tspan></text><rect x="64" y="1813" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="1841" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">งบปัจจุบันไม่เกิน 3 รอบ และ 3 คำถามต่อรอบ</tspan></text><text x="38" y="1943" fill="#64748b" font-family="Tahoma" font-size="14" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Code 5fdfb4d6 · ตรวจเส้นทาง 2026-10-04</tspan></text></svg>