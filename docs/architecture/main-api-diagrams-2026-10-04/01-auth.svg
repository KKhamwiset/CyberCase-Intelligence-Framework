<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1184" viewBox="0 0 1560 1184" role="img"><title>1. เข้าสู่ระบบและ Session</title><rect width="1560" height="1184" fill="white" /><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b" /></marker></defs><text x="38" y="48" fill="#0f172a" font-family="Tahoma" font-size="29" text-anchor="start" font-weight="700"><tspan x="38" dy="0">1. เข้าสู่ระบบและ Session</tspan></text><text x="38" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Frontend → HTTP API → Backend → ข้อมูล → ผลลัพธ์กลับสู่หน้าจอ</tspan></text><text x="1522" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="end" font-weight="400"><tspan x="1522" dy="0">เส้นทึบ = คำขอ / งานภายใน    เส้นประ = ผลลัพธ์</tspan></text><line x1="200.0" y1="202" x2="200.0" y2="1124" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="45.0" y="112" width="310" height="86" rx="10" fill="#eff6ff" stroke="#94a3b8" /><text x="200.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0">Frontend เข้าสู่ระบบ</tspan></text><line x1="780.0" y1="202" x2="780.0" y2="1124" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="625.0" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="780.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0">FastAPI auth/routes.py</tspan></text><line x1="1360.0" y1="202" x2="1360.0" y2="1124" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="1205.0" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="1360.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="1360.0" dy="0">PostgreSQL</tspan></text><rect x="64" y="224" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="252" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">API base = http://localhost:8000/api/v1</tspan></text><line x1="200.0" y1="342" x2="780.0" y2="342" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="242.5" y="301" width="495" height="28" rx="3" fill="white" /><text x="490.0" y="320" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">1. POST /auth/login — PasswordLoginRequest</tspan></text><line x1="780.0" y1="411" x2="1360.0" y2="411" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="822.5" y="370" width="495" height="28" rx="3" fill="white" /><text x="1070.0" y="389" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="1070.0" dy="0">2. authenticate — ตรวจผู้ใช้และรหัสผ่าน</tspan></text><line x1="1360.0" y1="480" x2="780.0" y2="480" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="822.5" y="439" width="495" height="28" rx="3" fill="white" /><text x="1070.0" y="458" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="1070.0" dy="0">3. User</tspan></text><line x1="780.0" y1="549" x2="200.0" y2="549" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="242.5" y="508" width="495" height="28" rx="3" fill="white" /><text x="490.0" y="527" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">4. UserRead + Set-Cookie HttpOnly</tspan></text><path d="M 200.0 618 H 335.0 V 645 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="577" width="350" height="28" rx="3" fill="white" /><text x="330.0" y="596" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">5. เก็บ session ใน Query cache</tspan></text><line x1="200.0" y1="705" x2="780.0" y2="705" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="242.5" y="664" width="495" height="28" rx="3" fill="white" /><text x="490.0" y="683" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">6. GET /auth/session — ส่ง cookie</tspan></text><line x1="780.0" y1="774" x2="200.0" y2="774" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="242.5" y="733" width="495" height="28" rx="3" fill="white" /><text x="490.0" y="752" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">7. UserRead หรือ null</tspan></text><rect x="64" y="804" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="832" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">สมัครสมาชิก — POST /auth/register → UserRead + cookie</tspan></text><line x1="200.0" y1="922" x2="780.0" y2="922" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="242.5" y="881" width="495" height="28" rx="3" fill="white" /><text x="490.0" y="900" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">8. POST /auth/logout</tspan></text><line x1="780.0" y1="991" x2="200.0" y2="991" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="242.5" y="950" width="495" height="28" rx="3" fill="white" /><text x="490.0" y="969" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">9. ล้าง session cookie</tspan></text><path d="M 200.0 1060 H 335.0 V 1087 H 200.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="155.0" y="1019" width="350" height="28" rx="3" fill="white" /><text x="330.0" y="1038" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0">10. อัปเดตสถานะผู้ใช้</tspan></text><text x="38" y="1159" fill="#64748b" font-family="Tahoma" font-size="14" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Code 5fdfb4d6 · ตรวจเส้นทาง 2026-10-04</tspan></text></svg>