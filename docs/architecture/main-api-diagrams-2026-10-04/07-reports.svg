<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1815" viewBox="0 0 1560 1815" role="img"><title>7. รายงานและดาวน์โหลด PDF / HTML</title><rect width="1560" height="1815" fill="white" /><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" /></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b" /></marker></defs><text x="38" y="48" fill="#0f172a" font-family="Tahoma" font-size="29" text-anchor="start" font-weight="700"><tspan x="38" dy="0">7. รายงานและดาวน์โหลด PDF / HTML</tspan></text><text x="38" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Frontend → HTTP API → Backend → ข้อมูล → ผลลัพธ์กลับสู่หน้าจอ</tspan></text><text x="1522" y="83" fill="#475569" font-family="Tahoma" font-size="16" text-anchor="end" font-weight="400"><tspan x="1522" dy="0">เส้นทึบ = คำขอ / งานภายใน    เส้นประ = ผลลัพธ์</tspan></text><line x1="200.0" y1="202" x2="200.0" y2="1755" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="45.0" y="112" width="310" height="86" rx="10" fill="#eff6ff" stroke="#94a3b8" /><text x="200.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0">Frontend CaseReportView</tspan></text><line x1="586.6666666666667" y1="202" x2="586.6666666666667" y2="1755" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="431.66666666666674" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="586.6666666666667" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="586.6666666666667" dy="0">FastAPI CaseReportService</tspan></text><line x1="973.3333333333334" y1="202" x2="973.3333333333334" y2="1755" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="818.3333333333334" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="973.3333333333334" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="973.3333333333334" dy="0">Report builder / Renderer</tspan></text><line x1="1360.0" y1="202" x2="1360.0" y2="1755" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6" /><rect x="1205.0" y="112" width="310" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" /><text x="1360.0" y="158" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="700"><tspan x="1360.0" dy="0">PostgreSQL</tspan></text><rect x="64" y="224" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="252" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">ทุก endpoint มี prefix /api/v1</tspan></text><line x1="200.0" y1="365" x2="586.6666666666667" y2="365" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="301" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="320" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">1. GET /cases/{case_id}/reports —</tspan><tspan x="393.33333333333337" dy="23">listCaseReports()</tspan></text><line x1="586.6666666666667" y1="434" x2="1360.0" y2="434" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="393" width="350" height="28" rx="3" fill="white" /><text x="973.3333333333334" y="412" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">2. อ่านรายงานของเคส</tspan></text><line x1="586.6666666666667" y1="503" x2="200.0" y2="503" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="462" width="350" height="28" rx="3" fill="white" /><text x="393.33333333333337" y="481" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">3. CaseReportRead[] → รุ่นรายงาน</tspan></text><line x1="200.0" y1="595" x2="586.6666666666667" y2="595" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="531" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="550" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">4. POST /cases/{case_id}/reports —</tspan><tspan x="393.33333333333337" dy="23">CaseReportCreate</tspan></text><line x1="586.6666666666667" y1="687" x2="1360.0" y2="687" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="623" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="642" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">5. เลือก analysis_result_id หรือ</tspan><tspan x="973.3333333333334" dy="23">latest validated analysis</tspan></text><line x1="1360.0" y1="779" x2="586.6666666666667" y2="779" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="798.3333333333334" y="715" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="734" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">6. Trace + sources / QA snapshots</tspan><tspan x="973.3333333333334" dy="23">ของ analysis</tspan></text><line x1="586.6666666666667" y1="871" x2="973.3333333333334" y2="871" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="807" width="350" height="51" rx="3" fill="white" /><text x="780.0" y="826" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">7. build_case_report_content —</tspan><tspan x="780.0" dy="23">สร้างรายงานจาก snapshot</tspan></text><line x1="973.3333333333334" y1="940" x2="586.6666666666667" y2="940" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="899" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="918" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">8. structured_report</tspan></text><line x1="586.6666666666667" y1="1032" x2="1360.0" y2="1032" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="798.3333333333334" y="968" width="350" height="51" rx="3" fill="white" /><text x="973.3333333333334" y="987" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="973.3333333333334" dy="0">9. เก็บ CaseReport —</tspan><tspan x="973.3333333333334" dy="23">หนึ่งรายงานต่อหนึ่ง analysis</tspan></text><line x1="586.6666666666667" y1="1101" x2="200.0" y2="1101" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="1060" width="350" height="28" rx="3" fill="white" /><text x="393.33333333333337" y="1079" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">10. CaseReportRead → แสดงรายงาน</tspan></text><rect x="64" y="1131" width="1432" height="57" rx="6" fill="#f1f5f9" /><text x="780.0" y="1159" fill="#334155" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">ถ้ามีรายงานของ analysis นี้แล้ว จะคืนรายงานเดิม</tspan></text><line x1="200.0" y1="1272" x2="586.6666666666667" y2="1272" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="1208" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="1227" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">11. GET /cases/{case_id}/reports/{</tspan><tspan x="393.33333333333337" dy="23">report_id}/pdf</tspan></text><line x1="586.6666666666667" y1="1341" x2="973.3333333333334" y2="1341" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="1300" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="1319" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">12. Jinja2 HTML → WeasyPrint PDF</tspan></text><line x1="973.3333333333334" y1="1410" x2="586.6666666666667" y2="1410" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="605.0" y="1369" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="1388" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">13. PDF bytes</tspan></text><line x1="586.6666666666667" y1="1479" x2="200.0" y2="1479" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="1438" width="350" height="28" rx="3" fill="white" /><text x="393.33333333333337" y="1457" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">14. Blob → ดาวน์โหลด PDF</tspan></text><line x1="200.0" y1="1571" x2="586.6666666666667" y2="1571" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="218.33333333333337" y="1507" width="350" height="51" rx="3" fill="white" /><text x="393.33333333333337" y="1526" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">15. GET /cases/{case_id}/reports/{</tspan><tspan x="393.33333333333337" dy="23">report_id}/html</tspan></text><line x1="586.6666666666667" y1="1640" x2="973.3333333333334" y2="1640" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#request)" /><rect x="605.0" y="1599" width="350" height="28" rx="3" fill="white" /><text x="780.0" y="1618" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="780.0" dy="0">16. Render snapshot เป็น HTML</tspan></text><line x1="586.6666666666667" y1="1709" x2="200.0" y2="1709" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#response)" stroke-dasharray="7 5" /><rect x="218.33333333333337" y="1668" width="350" height="28" rx="3" fill="white" /><text x="393.33333333333337" y="1687" fill="#0f172a" font-family="Tahoma" font-size="16" text-anchor="middle" font-weight="400"><tspan x="393.33333333333337" dy="0">17. HTML → ดาวน์โหลดหรือเปิดรายงาน</tspan></text><text x="38" y="1790" fill="#64748b" font-family="Tahoma" font-size="14" text-anchor="start" font-weight="400"><tspan x="38" dy="0">Code 5fdfb4d6 · ตรวจเส้นทาง 2026-10-04</tspan></text></svg>