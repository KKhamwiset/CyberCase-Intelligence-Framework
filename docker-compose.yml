# ── Secrets via Doppler ────────────────────────────────────────────────────────
# Run with: doppler run -- docker compose up --build
# Doppler injects all secrets as shell env vars; Docker Compose reads them via ${VAR} expansion.
# Local override: doppler secrets download --no-header --format=docker > .env
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Neo4j is cloud-hosted — no local service needed.
  db:
    image: postgres:16-alpine
    container_name: cybercase-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cybercase_framework}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cybercase_framework}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybercase-backend
    restart: always
    # Secrets, the database login it shares with `db`, and the model switch.
    # Everything else is the default in backend/app/config.py.
    environment:
      CASE_ANALYSIS_MODEL: ${CASE_ANALYSIS_MODEL:-deepseek/deepseek-v4.1-flash}
      OPENROUTER_CYBERCASE: ${OPENROUTER_CYBERCASE:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cybercase_framework}
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      rag-service:
        condition: service_started

  # ── RAG Service ─────────────────────────────────────────────────────────────
  rag-service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    container_name: cybercase-rag-service
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      CORE_LLM_PROVIDER: ${CORE_LLM_PROVIDER:-openrouter}
      CORE_LLM_OPENROUTER_MODEL: ${CORE_LLM_OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      OPENROUTER_CYBERCASE: ${OPENROUTER_CYBERCASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEO4J_URI: ${NEO4J_URI:?NEO4J_URI is required}
      NEO4J_USER: ${NEO4J_USER:?NEO4J_USER is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      THANOY_API_KEY: ${THANOY_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8001:8001"
    volumes:
      - ./rag_service/app:/app/app
      - ${USERPROFILE}/.cache/huggingface:/app/model_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: npm run dev -- --webpack
    container_name: cybercase-frontend
    restart: always

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"

    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
