# ── Secrets via Doppler ────────────────────────────────────────────────────────
# Run with: doppler run -- docker compose up --build
# Doppler injects all secrets as shell env vars; Docker Compose reads them via ${VAR} expansion.
# Local override: doppler secrets download --no-header --format=docker > .env
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Neo4j is cloud-hosted — no local service needed.
  db:
    image: postgres:16-alpine
    container_name: cybercase-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cybercase_framework}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cybercase_framework}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cybercase-backend
    restart: always
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cybercase_framework}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TYPHOON_OCR_API_KEY: ${TYPHOON_OCR_API_KEY:-}
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_SERVICE_URL: http://rag-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      rag-service:
        condition: service_started

  # ── RAG Service ─────────────────────────────────────────────────────────────
  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: cybercase-rag-service
    restart: always
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      NEO4J_URI: ${NEO4J_URI:?NEO4J_URI is required}
      NEO4J_USER: ${NEO4J_USER:?NEO4J_USER is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - ./rag_service/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: cybercase-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
